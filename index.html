<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake - Jogo da Cobra</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center}.game{width:min(94vw,520px);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h1{margin:0;font-size:28px;color:#55e36b}.score{font-size:20px}canvas{width:100%;aspect-ratio:1;background:#181818;border:3px solid #55e36b;border-radius:12px;touch-action:none}button{border:0;border-radius:12px;background:#55e36b;color:#07120a;font-weight:bold;font-size:18px;padding:12px 18px;margin-top:12px}.controls{width:220px;margin:14px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controls button{margin:0;height:58px;padding:0;font-size:26px}.empty{visibility:hidden}.msg{height:28px;margin-top:8px;font-weight:bold}.small{font-size:13px;color:#aaa;margin-top:8px}
</style></head><body><div class="game"><div class="top"><h1>🐍 SNAKE</h1><div class="score">Fase: <b id="level">1</b> | Pontos: <b id="score">0</b></div></div><canvas id="game" width="400" height="400"></canvas><div id="msg" class="msg">Use as setas ou os botões</div><button id="restart">Começar / Reiniciar</button><div class="controls"><button class="empty">•</button><button data-dir="up">⬆️</button><button class="empty">•</button><button data-dir="left">⬅️</button><button data-dir="down">⬇️</button><button data-dir="right">➡️</button></div><div class="small">🍎 Pegue as maçãs. Deslize o dedo na tela para controlar a cobra.</div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),msg=document.getElementById('msg');const N=20,cell=c.width/N;let snake,food,dir,nextDir,score,level,running,timer,obstacles;
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;level=1;scoreEl.textContent=score;document.getElementById('level').textContent=level;food=makeFood();obstacles=[];running=true;msg.textContent='Fase 1 — Boa sorte!';clearInterval(timer);timer=setInterval(tick,145);draw()}
function makeObstacles(){const count=Math.min(18,(level-1)*2),obs=[];let tries=0;while(obs.length<count&&tries<500){tries++;const o={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)},nearStart=Math.abs(o.x-10)<=3&&Math.abs(o.y-10)<=2,onSnake=snake.some(s=>s.x===o.x&&s.y===o.y);if(!nearStart&&!onSnake&&!obs.some(v=>v.x===o.x&&v.y===o.y))obs.push(o)}return obs}
function makeFood(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function setDir(d){if(!running)return;if(d.x!==-dir.x||d.y!==-dir.y)nextDir=d}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(obstacles.some(o=>o.x===head.x&&o.y===head.y)){running=false;clearInterval(timer);msg.textContent='🧱 Você bateu no obstáculo!';draw();return}if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){running=false;clearInterval(timer);msg.textContent='💥 Fim de jogo!';draw();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;food=makeFood();const newLevel=Math.min(10,Math.floor(score/5)+1);if(newLevel!==level){level=newLevel;document.getElementById('level').textContent=level;obstacles=makeObstacles();msg.textContent='🎉 Fase '+level+'!'}const speed=Math.max(90,145-(level-1)*6);clearInterval(timer);timer=setInterval(tick,speed)}else snake.pop();draw()}
function draw(){ctx.fillStyle='#181818';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#202020';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,c.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(c.width,i*cell);ctx.stroke()}obstacles.forEach(o=>{ctx.fillStyle='#777';ctx.fillRect(o.x*cell+2,o.y*cell+2,cell-4,cell-4);ctx.fillStyle='#999';ctx.fillRect(o.x*cell+5,o.y*cell+5,cell-10,4)});const fx=food.x*cell+cell/2,fy=food.y*cell+cell/2;ctx.fillStyle='#e53935';ctx.beginPath();ctx.arc(fx,fy+3,cell*.30,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8b1e1e';ctx.fillRect(fx-2,fy-cell*.27,4,cell*.14);ctx.fillStyle='#55b84a';ctx.beginPath();ctx.ellipse(fx+cell*.13,fy-cell*.25,cell*.14,cell*.07,-.35,0,Math.PI*2);ctx.fill();snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#7cff82':'#35c94a';ctx.fillRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4)});const h=snake[0],cx=h.x*cell+cell/2,cy=h.y*cell+cell/2;let ex=0,ey=0;if(dir.x!==0){ex=0;ey=cell*.16}else{ex=cell*.16;ey=0}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-ex,cy-ey,cell*.10,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+ex,cy+ey,cell*.10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(cx-ex+dir.x*2,cy-ey+dir.y*2,cell*.045,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+ex+dir.x*2,cy+ey+dir.y*2,cell*.045,0,Math.PI*2);ctx.fill();if(!running){ctx.fillStyle='rgba(0,0,0,.58)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 30px Arial';ctx.fillText('FIM DE JOGO',c.width/2,c.height/2-10);ctx.font='18px Arial';ctx.fillText('Toque em Reiniciar',c.width/2,c.height/2+25)}}
document.addEventListener('keydown',e=>{const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};if(m[e.key]){e.preventDefault();setDir(m[e.key])}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',()=>{const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};setDir(m[b.dataset.dir])}));let touchStartX=0,touchStartY=0;c.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY;e.preventDefault()},{passive:false});c.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.max(Math.abs(dx),Math.abs(dy))<18){e.preventDefault();return}if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?{x:1,y:0}:{x:-1,y:0});else setDir(dy>0?{x:0,y:1}:{x:0,y:-1});e.preventDefault()},{passive:false});document.getElementById('restart').onclick=reset;reset();
</script></body></html>
