<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Element Maze</title><style>body{margin:0;background:#05060b;color:white;font:16px Arial;text-align:center}h1{color:#ffd21c}.hud{display:flex;justify-content:center;gap:25px;font-weight:bold}canvas{max-width:96vw;width:600px;background:#000;border:3px solid #1460ff;border-radius:12px}button{font-size:28px;margin:3px;width:60px;height:55px;background:#071127;color:white;border:2px solid #1680ff;border-radius:10px}</style><h1>ELEMENT MAZE</h1><div class='hud'><span id=s>Pontos: 0</span><span id=l>Vidas: ❤️❤️❤️</span></div><canvas id=c width=600 height=600></canvas><div><button onclick='d(0,-1)'>▲</button><br><button onclick='d(-1,0)'>◀</button><button onclick='d(0,1)'>▼</button><button onclick='d(1,0)'>▶</button></div><p>Setas/WASD • Colete os orbes • Fuja das criaturas elementais</p><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),N=20,T=30;let p={x:10,y:17},v=3,sc=0,dir={x:0,y:0},want={x:0,y:0},over=0,dots=[],en=[{x:9,y:9,e:'🔥'},{x:10,y:9,e:'💧'},{x:11,y:9,e:'🌿'},{x:12,y:9,e:'☁️'}];for(let y=0;y<N;y++)for(let z=0;z<N;z++)if((x=z,y) && (x==0||y==0||x==N-1||y==N-1||(y%4==0&&x%2==0))){}for(let y=1;y<N-1;y++)for(let z=1;z<N-1;z++)if(!(y%4==0&&z%2==0)&&!(y==9&&z>7&&z<14))dots.push({x:z,y});function wall(a,b){return a<0||b<0||a>=N||b>=N||((b%4==0&&a%2==0)&&!(b==9&&a>7&&a<14))}function d(a,b){want={x:a,y:b}}document.onkeydown=e=>{let k=e.key.toLowerCase();let q={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(q)d(...q);if(over&&k=='enter')location.reload()};function draw(){x.clearRect(0,0,600,600);x.strokeStyle='#1460ff';x.lineWidth=3;for(let y=0;y<N;y++)for(let z=0;z<N;z++)if(wall(z,y)){x.strokeRect(z*T+2,y*T+2,T-4,T-4)}x.fillStyle='#ffd21c';dots.forEach(q=>{x.beginPath();x.arc(q.x*T+15,q.y*T+15,3,0,7);x.fill()});x.font='23px Arial';en.forEach(q=>x.fillText(q.e,q.x*T+4,q.y*T+25));x.fillStyle='#ffd21c';x.beginPath();x.arc(p.x*T+15,p.y*T+15,13,0,7);x.fill();if(over){x.fillStyle='#000d';x.fillRect(0,0,600,600);x.fillStyle='#fff';x.font='bold 42px Arial';x.fillText(v?'FIM DE JOGO':'VOCÊ VENCEU!',120,290);x.font='18px Arial';x.fillText('ENTER para reiniciar',210,330)}}function tick(){if(!over){if(!wall(p.x+want.x,p.y+want.y))dir=want;if(!wall(p.x+dir.x,p.y+dir.y)){p.x+=dir.x;p.y+=dir.y}let i=dots.findIndex(q=>q.x==p.x&&q.y==p.y);if(i>=0){dots.splice(i,1);sc+=10}en.forEach(q=>{let opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(a=>!wall(q.x+a[0],q.y+a[1]));if(opts.length){opts.sort((a,b)=>Math.hypot(q.x+a[0]-p.x,q.y+a[1]-p.y)-Math.hypot(q.x+b[0]-p.x,q.y+b[1]-p.y));if(Math.random()<.75)[q.x,q.y]=[q.x+opts[0][0],q.y+opts[0][1]];else[q.x,q.y]=[q.x+opts[~~(Math.random()*opts.length)][0],q.y+opts[~~(Math.random()*opts.length)][1]]}if(q.x==p.x&&q.y==p.y){v--;document.querySelector('#l').textContent='Vidas: '+'❤️'.repeat(v)+'🖤'.repeat(3-v);p={x:10,y:17};dir=want={x:0,y:0};if(v<=0)over=1}});if(!dots.length)over=1;document.querySelector('#s').textContent='Pontos: '+sc}draw()}setInterval(tick,150);tick()</script></html>
