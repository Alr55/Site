<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake - Jogo da Cobra</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center}.game{width:min(94vw,520px);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}h1{margin:0;font-size:28px;color:#55e36b}.score{font-size:16px;text-align:right}canvas{width:100%;aspect-ratio:1;background:#181818;border:3px solid #55e36b;border-radius:12px;touch-action:none;display:block}.stats{display:flex;justify-content:space-around;margin:7px 0;font-size:15px}.panel{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:7px 0}.panel button,button{border:0;border-radius:10px;background:#55e36b;color:#07120a;font-weight:bold;font-size:15px;padding:9px 13px}.skin{background:#333!important;color:#fff!important;border:2px solid transparent}.skin.active{border-color:#55e36b}.msg{min-height:24px;margin:6px 0;font-weight:bold}.small{font-size:12px;color:#aaa;margin-top:7px}.boss{color:#ffb84d}
</style></head>
<body><div class="game">
<div class="top"><h1>🐍 SNAKE</h1><div class="score">🏆 Recorde: <b id="best">0</b></div></div>
<div class="stats"><span>❤️ Vidas: <b id="lives">3</b></span><span>🪙 Moedas: <b id="coins">0</b></span><span>⭐ Fase: <b id="level">1</b></span><span>🍎 <b id="score">0</b></span></div>
<canvas id="game" width="400" height="400"></canvas>
<div id="msg" class="msg">Deslize o dedo para controlar</div>
<div class="panel"><button id="restart">Começar / Reiniciar</button><button id="sound">🔊 Som</button></div>
<div class="panel"><button class="skin active" data-skin="green">🟢 Verde</button><button class="skin" data-skin="blue">🔵 Azul</button><button class="skin" data-skin="gold">🟡 Dourada</button></div>
<div class="small">🍎 Maçãs dão pontos • 🪙 moedas valem 1 moeda • 👑 chefes aparecem nas fases 5 e 10</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),N=20,cell=c.width/N;
const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best'),coinsEl=document.getElementById('coins'),msg=document.getElementById('msg');
let snake,food,coin,dir,nextDir,score,level,lives,running,timer,obstacles,boss,skin='green',soundOn=true,best=Number(localStorage.getItem('snakeBest')||0),coinsTotal=Number(localStorage.getItem('snakeCoins')||0),audio;
bestEl.textContent=best;coinsEl.textContent=coinsTotal;
const skins={green:['#7cff82','#35c94a'],blue:['#74b9ff','#2980d9'],gold:['#ffe27a','#d9a400']};
function beep(freq=500,dur=.07){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.value=.045;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch(e){}}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;level=1;lives=3;obstacles=[];boss=null;food=makeFood();coin=null;running=true;updateUI();msg.textContent='Fase 1 — Boa sorte!';clearInterval(timer);timer=setInterval(tick,170);draw()}
function updateUI(){scoreEl.textContent=score;levelEl.textContent=level;livesEl.textContent=lives;coinsEl.textContent=coinsTotal;bestEl.textContent=best}
function freeCell(){let p,tries=0;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};tries++}while(tries<500&&(snake.some(s=>s.x===p.x&&s.y===p.y)||obstacles.some(o=>o.x===p.x&&o.y===p.y)||(boss&&boss.x===p.x&&boss.y===p.y)));return p}
function makeFood(){return freeCell()}
function makeCoin(){return Math.random()<.8?freeCell():null}
function makeObstacles(){const count=Math.min(10,Math.max(0,(level-2)));const obs=[];let tries=0;while(obs.length<count&&tries++<500){const o={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};const near=Math.abs(o.x-10)<=4&&Math.abs(o.y-10)<=3;if(!near&&!snake.some(s=>s.x===o.x&&s.y===o.y)&&!obs.some(v=>v.x===o.x&&v.y===o.y))obs.push(o)}return obs}
function makeBoss(){if(level<5)return null;let p=freeCell();return {x:p.x,y:p.y,hp:level>=10?5:3,maxHp:level>=10?5:3,move:0}}
function setDir(d){if(!running)return;if(d.x!==-dir.x||d.y!==-dir.y)nextDir=d}
function loseLife(reason){lives--;beep(160,.15);if(lives<=0){running=false;clearInterval(timer);msg.textContent='💥 Fim de jogo!';if(score>best){best=score;localStorage.setItem('snakeBest',best)}updateUI();draw();return}snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};msg.textContent='❤️ Você perdeu uma vida!';updateUI();draw()}
function tick(){if(!running)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)||obstacles.some(o=>o.x===head.x&&o.y===head.y)){loseLife('');return}
if(boss&&head.x===boss.x&&head.y===boss.y){boss.hp--;beep(250,.08);if(boss.hp<=0){score+=10;boss=null;msg.textContent='👑 CHEFE DERROTADO! +10';beep(800,.2)}else{loseLife('');return}}
snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;beep(700);food=makeFood();if(score>best){best=score;localStorage.setItem('snakeBest',best)}const nl=Math.min(10,Math.floor(score/5)+1);if(nl!==level){level=nl;obstacles=makeObstacles();boss=makeBoss();coin=makeCoin();msg.textContent=level===5||level===10?'👑 CHEFE DA FASE!':'🎉 Fase '+level+'!';beep(900,.15)}else if(!coin)coin=makeCoin();const speed=Math.max(115,170-(level-1)*5);clearInterval(timer);timer=setInterval(tick,speed)}else snake.pop();
if(coin&&head.x===coin.x&&head.y===coin.y){coinsTotal++;localStorage.setItem('snakeCoins',coinsTotal);coin=null;beep(1000,.08)}
if(boss){boss.move++;if(boss.move%3===0){const dx=snake[0].x-boss.x,dy=snake[0].y-boss.y;if(Math.abs(dx)>Math.abs(dy))boss.x+=Math.sign(dx);else boss.y+=Math.sign(dy)}}updateUI();draw()}
function draw(){ctx.fillStyle='#181818';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#202020';for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,c.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(c.width,i*cell);ctx.stroke()}
obstacles.forEach(o=>{ctx.fillStyle='#777';ctx.fillRect(o.x*cell+2,o.y*cell+2,cell-4,cell-4);ctx.fillStyle='#aaa';ctx.fillRect(o.x*cell+5,o.y*cell+5,cell-10,4)});
if(coin){ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(coin.x*cell+cell/2,coin.y*cell+cell/2,cell*.25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8b6500';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('$',coin.x*cell+cell/2,coin.y*cell+cell/2+4)}
const fx=food.x*cell+cell/2,fy=food.y*cell+cell/2;ctx.fillStyle='#e53935';ctx.beginPath();ctx.arc(fx,fy+3,cell*.30,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8b1e1e';ctx.fillRect(fx-2,fy-cell*.27,4,cell*.14);ctx.fillStyle='#55b84a';ctx.beginPath();ctx.ellipse(fx+cell*.13,fy-cell*.25,cell*.14,cell*.07,-.35,0,Math.PI*2);ctx.fill();
if(boss){ctx.fillStyle='#9b59b6';ctx.beginPath();ctx.arc(boss.x*cell+cell/2,boss.y*cell+cell/2,cell*.38,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('👑',boss.x*cell+cell/2,boss.y*cell+cell/2+4);ctx.fillStyle='#e74c3c';ctx.fillRect(boss.x*cell+3,boss.y*cell-5,cell-6,3);ctx.fillStyle='#2ecc71';ctx.fillRect(boss.x*cell+3,boss.y*cell-5,(cell-6)*(boss.hp/boss.maxHp),3)}
const col=skins[skin];snake.forEach((s,i)=>{ctx.fillStyle=i===0?col[0]:col[1];ctx.fillRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4)});const h=snake[0],cx=h.x*cell+cell/2,cy=h.y*cell+cell/2;let ex=dir.x!==0?0:cell*.16,ey=dir.x!==0?cell*.16:0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-ex,cy-ey,cell*.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+ex,cy+ey,cell*.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(cx-ex+dir.x*2,cy-ey+dir.y*2,cell*.045,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+ex+dir.x*2,cy+ey+dir.y*2,cell*.045,0,Math.PI*2);ctx.fill();
if(!running){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 30px Arial';ctx.fillText('FIM DE JOGO',c.width/2,c.height/2-10);ctx.font='18px Arial';ctx.fillText('Toque em Reiniciar',c.width/2,c.height/2+25)}}
document.addEventListener('keydown',e=>{const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};if(m[e.key]){e.preventDefault();setDir(m[e.key])}});
let touchStartX=0,touchStartY=0;c.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY;e.preventDefault()},{passive:false});c.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.max(Math.abs(dx),Math.abs(dy))<12){e.preventDefault();return}setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?{x:1,y:0}:{x:-1,y:0}):(dy>0?{x:0,y:1}:{x:0,y:-1}));e.preventDefault()},{passive:false});
document.querySelectorAll('.skin').forEach(b=>b.onclick=()=>{skin=b.dataset.skin;document.querySelectorAll('.skin').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()});document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Som':'🔇 Som';if(soundOn)beep()};document.getElementById('restart').onclick=reset;reset();
</script></body></html>
